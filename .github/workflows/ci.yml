name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Signing vectors match the reference (and the known vectors)
        run: python tools/generate_vectors.py --check

      - name: Response fixtures and webhook samples follow the rules
        run: python tools/check_fixtures.py

      - name: Regenerating leaves the tree unchanged
        run: |
          python tools/generate_vectors.py
          git diff --exit-code
